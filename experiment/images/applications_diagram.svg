<svg width="700" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="700" height="500" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  
  <!-- Title -->
  <text x="350" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">
    Real-World Applications of Partial Orders
  </text>
  
  <!-- Git Version Control -->
  <rect x="50" y="50" width="180" height="120" fill="white" stroke="#3498db" stroke-width="2" rx="10"/>
  <text x="140" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#3498db">Git Version Control</text>
  
  <circle cx="100" cy="90" r="8" fill="#e74c3c"/>
  <circle cx="140" cy="90" r="8" fill="#2ecc71"/>
  <circle cx="180" cy="90" r="8" fill="#f39c12"/>
  <circle cx="120" cy="120" r="8" fill="#9b59b6"/>
  <circle cx="160" cy="120" r="8" fill="#3498db"/>
  <circle cx="140" cy="150" r="8" fill="#e67e22"/>
  
  <line x1="100" y1="98" x2="115" y2="112" stroke="#666" stroke-width="1"/>
  <line x1="140" y1="98" x2="125" y2="112" stroke="#666" stroke-width="1"/>
  <line x1="180" y1="98" x2="165" y2="112" stroke="#666" stroke-width="1"/>
  <line x1="120" y1="128" x2="135" y2="142" stroke="#666" stroke-width="1"/>
  <line x1="160" y1="128" x2="145" y2="142" stroke="#666" stroke-width="1"/>
  
  <text x="140" y="165" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Commits ≼ Ancestors</text>
  
  <!-- Task Dependencies -->
  <rect x="260" y="50" width="180" height="120" fill="white" stroke="#2ecc71" stroke-width="2" rx="10"/>
  <text x="350" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2ecc71">Task Dependencies</text>
  
  <circle cx="320" cy="90" r="10" fill="#3498db"/>
  <text x="320" y="95" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">T1</text>
  
  <circle cx="300" cy="120" r="10" fill="#3498db"/>
  <text x="300" y="125" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">T2</text>
  
  <circle cx="340" cy="120" r="10" fill="#3498db"/>
  <text x="340" y="125" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">T3</text>
  
  <circle cx="380" cy="120" r="10" fill="#3498db"/>
  <text x="380" y="125" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">T4</text>
  
  <circle cx="350" cy="150" r="10" fill="#e74c3c"/>
  <text x="350" y="155" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">T5</text>
  
  <line x1="315" y1="99" x2="305" y2="111" stroke="#666" stroke-width="2"/>
  <line x1="325" y1="99" x2="335" y2="111" stroke="#666" stroke-width="2"/>
  <line x1="330" y1="99" x2="375" y2="111" stroke="#666" stroke-width="2"/>
  <line x1="310" y1="129" x2="345" y2="141" stroke="#666" stroke-width="2"/>
  <line x1="350" y1="129" x2="345" y2="141" stroke="#666" stroke-width="2"/>
  <line x1="375" y1="129" x2="355" y2="141" stroke="#666" stroke-width="2"/>
  
  <text x="350" y="165" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Prerequisites ≼ Tasks</text>
  
  <!-- Security Classifications -->
  <rect x="470" y="50" width="180" height="120" fill="white" stroke="#e74c3c" stroke-width="2" rx="10"/>
  <text x="560" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#e74c3c">Security Lattice</text>
  
  <circle cx="560" cy="90" r="12" fill="#e74c3c"/>
  <text x="560" y="88" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">TOP</text>
  <text x="560" y="96" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">SEC</text>
  
  <circle cx="530" cy="120" r="12" fill="#f39c12"/>
  <text x="530" y="126" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">SEC</text>
  
  <circle cx="590" cy="120" r="12" fill="#f39c12"/>
  <text x="590" y="126" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">CONF</text>
  
  <circle cx="560" cy="150" r="12" fill="#2ecc71"/>
  <text x="560" y="156" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">UNCL</text>
  
  <line x1="550" y1="100" x2="540" y2="110" stroke="#666" stroke-width="2"/>
  <line x1="570" y1="100" x2="580" y2="110" stroke="#666" stroke-width="2"/>
  <line x1="540" y1="130" x2="550" y2="140" stroke="#666" stroke-width="2"/>
  <line x1="580" y1="130" x2="570" y2="140" stroke="#666" stroke-width="2"/>
  
  <text x="560" y="165" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Clearance ≼ Access</text>
  
  <!-- Concept Hierarchy -->
  <rect x="50" y="200" width="200" height="140" fill="white" stroke="#9b59b6" stroke-width="2" rx="10"/>
  <text x="150" y="220" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#9b59b6">Concept Hierarchy</text>
  
  <circle cx="150" cy="240" r="15" fill="#9b59b6"/>
  <text x="150" y="236" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">Animal</text>
  
  <circle cx="120" cy="270" r="15" fill="#3498db"/>
  <text x="120" y="266" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">Mammal</text>
  
  <circle cx="180" cy="270" r="15" fill="#3498db"/>
  <text x="180" y="266" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">Bird</text>
  
  <circle cx="90" cy="300" r="15" fill="#2ecc71"/>
  <text x="90" y="296" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">Dog</text>
  
  <circle cx="150" cy="300" r="15" fill="#2ecc71"/>
  <text x="150" y="296" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">Cat</text>
  
  <circle cx="210" cy="300" r="15" fill="#2ecc71"/>
  <text x="210" y="296" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">Eagle</text>
  
  <line x1="140" y1="253" x2="130" y2="257" stroke="#666" stroke-width="2"/>
  <line x1="160" y1="253" x2="170" y2="257" stroke="#666" stroke-width="2"/>
  <line x1="110" y1="283" x2="100" y2="287" stroke="#666" stroke-width="2"/>
  <line x1="130" y1="283" x2="140" y2="287" stroke="#666" stroke-width="2"/>
  <line x1="190" y1="283" x2="200" y2="287" stroke="#666" stroke-width="2"/>
  
  <text x="150" y="325" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Specific ≼ General</text>
  
  <!-- Resource Allocation -->
  <rect x="280" y="200" width="200" height="140" fill="white" stroke="#f39c12" stroke-width="2" rx="10"/>
  <text x="380" y="220" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#f39c12">Resource Allocation</text>
  
  <!-- Resource nodes -->
  <circle cx="380" cy="240" r="15" fill="#e74c3c"/>
  <text x="380" y="235" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">4CPU</text>
  <text x="380" y="245" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">4GB</text>
  
  <circle cx="340" cy="270" r="15" fill="#3498db"/>
  <text x="340" y="265" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">2CPU</text>
  <text x="340" y="275" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">4GB</text>
  
  <circle cx="420" cy="270" r="15" fill="#3498db"/>
  <text x="420" y="265" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">4CPU</text>
  <text x="420" y="275" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">2GB</text>
  
  <circle cx="380" cy="300" r="15" fill="#2ecc71"/>
  <text x="380" y="295" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">2CPU</text>
  <text x="380" y="305" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">2GB</text>
  
  <line x1="370" y1="253" x2="350" y2="257" stroke="#666" stroke-width="2"/>
  <line x1="390" y1="253" x2="410" y2="257" stroke="#666" stroke-width="2"/>
  <line x1="350" y1="283" x2="370" y2="287" stroke="#666" stroke-width="2"/>
  <line x1="410" y1="283" x2="390" y2="287" stroke="#666" stroke-width="2"/>
  
  <text x="380" y="325" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Resource ≼ Dominance</text>
  
  <!-- Database Queries -->
  <rect x="510" y="200" width="160" height="140" fill="white" stroke="#2ecc71" stroke-width="2" rx="10"/>
  <text x="590" y="220" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2ecc71">Database Queries</text>
  
  <rect x="520" y="235" width="140" height="20" fill="#e74c3c" rx="3"/>
  <text x="590" y="248" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">SELECT * FROM emp</text>
  
  <rect x="530" y="265" width="120" height="20" fill="#3498db" rx="3"/>
  <text x="590" y="276" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">WHERE dept='Eng'</text>
  
  <rect x="540" y="295" width="100" height="20" fill="#2ecc71" rx="3"/>
  <text x="590" y="306" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">AND sal>100k</text>
  
  <line x1="590" y1="255" x2="590" y2="265" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="285" x2="590" y2="295" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <text x="590" y="325" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Specific ≼ General</text>
  
  <!-- Concurrent Events -->
  <rect x="50" y="360" width="280" height="120" fill="white" stroke="#e67e22" stroke-width="2" rx="10"/>
  <text x="190" y="380" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#e67e22">Concurrent System Events</text>
  
  <!-- Process 1 events -->
  <text x="80" y="400" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Process 1:</text>
  <circle cx="120" cy="410" r="8" fill="#3498db"/>
  <text x="120" y="414" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">a</text>
  <circle cx="160" cy="410" r="8" fill="#3498db"/>
  <text x="160" y="414" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">b</text>
  <circle cx="200" cy="410" r="8" fill="#3498db"/>
  <text x="200" y="414" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">c</text>
  
  <!-- Process 2 events -->
  <text x="80" y="440" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Process 2:</text>
  <circle cx="140" cy="450" r="8" fill="#e74c3c"/>
  <text x="140" y="454" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">x</text>
  <circle cx="180" cy="450" r="8" fill="#e74c3c"/>
  <text x="180" y="454" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">y</text>
  
  <!-- Causal arrows -->
  <line x1="128" y1="410" x2="152" y2="410" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="168" y1="410" x2="192" y2="410" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="148" y1="450" x2="172" y2="450" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="155" y1="417" x2="145" y2="443" stroke="#f39c12" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  
  <text x="190" y="470" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Causal ≼ Happens-Before</text>
  
  <!-- Preference Model -->
  <rect x="360" y="360" width="300" height="120" fill="white" stroke="#9b59b6" stroke-width="2" rx="10"/>
  <text x="510" y="380" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#9b59b6">Consumer Preferences</text>
  
  <!-- Phone comparison -->
  <circle cx="420" cy="410" r="25" fill="#3498db"/>
  <text x="420" y="405" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">Phone A</text>
  <text x="420" y="415" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">$800, Fast</text>
  <text x="420" y="423" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">Poor Battery</text>
  
  <circle cx="520" cy="410" r="25" fill="#e74c3c"/>
  <text x="520" y="405" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">Phone B</text>
  <text x="520" y="415" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">$600, Avg</text>
  <text x="520" y="423" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">Great Battery</text>
  
  <circle cx="470" cy="450" r="25" fill="#2ecc71"/>
  <text x="470" y="445" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">Phone C</text>
  <text x="470" y="455" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">$400, Slow</text>
  <text x="470" y="463" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">Poor Battery</text>
  
  <line x1="450" y1="440" x2="440" y2="430" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="440" x2="500" y2="430" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <text x="580" y="440" font-family="Arial, sans-serif" font-size="10" fill="#666">A, B incomparable</text>
  <text x="580" y="455" font-family="Arial, sans-serif" font-size="10" fill="#666">(different tradeoffs)</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
</svg>