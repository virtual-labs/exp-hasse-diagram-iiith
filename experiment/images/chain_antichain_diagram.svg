<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  
  <!-- Title -->
  <text x="300" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">
    Chains and Antichains in Divisibility Poset {1,2,3,4,6,8,12}
  </text>
  
  <!-- Main poset nodes -->
  <circle cx="300" cy="60" r="18" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="300" y="66" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">12</text>
  
  <circle cx="200" cy="120" r="18" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="200" y="126" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">4</text>
  
  <circle cx="300" cy="120" r="18" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="300" y="126" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">6</text>
  
  <circle cx="400" cy="120" r="18" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="400" y="126" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">8</text>
  
  <circle cx="150" cy="180" r="18" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <text x="150" y="186" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">2</text>
  
  <circle cx="350" cy="180" r="18" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <text x="350" y="186" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">3</text>
  
  <circle cx="250" cy="240" r="18" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="250" y="246" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">1</text>
  
  <!-- Main edges -->
  <line x1="285" y1="75" x2="215" y2="105" stroke="#666" stroke-width="2"/>
  <line x1="300" y1="78" x2="300" y2="102" stroke="#666" stroke-width="2"/>
  <line x1="315" y1="75" x2="385" y2="105" stroke="#666" stroke-width="2"/>
  
  <line x1="185" y1="135" x2="165" y2="165" stroke="#666" stroke-width="2"/>
  <line x1="215" y1="135" x2="385" y2="105" stroke="#666" stroke-width="2"/>
  <line x1="285" y1="135" x2="165" y2="165" stroke="#666" stroke-width="2"/>
  <line x1="315" y1="135" x2="335" y2="165" stroke="#666" stroke-width="2"/>
  
  <line x1="165" y1="195" x2="235" y2="225" stroke="#666" stroke-width="2"/>
  <line x1="335" y1="195" x2="265" y2="225" stroke="#666" stroke-width="2"/>
  
  <!-- Chain highlighting -->
  <rect x="500" y="60" width="3" height="180" fill="#e74c3c" opacity="0.7"/>
  <text x="510" y="75" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">Chain:</text>
  <text x="510" y="90" font-family="Arial, sans-serif" font-size="11" fill="#e74c3c">1 → 2 → 4 → 12</text>
  
  <!-- Antichain highlighting -->
  <ellipse cx="300" cy="120" rx="120" ry="25" fill="none" stroke="#f39c12" stroke-width="3" stroke-dasharray="5,5"/>
  <text x="300" y="155" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#f39c12">
    Antichain: {4, 6, 8}
  </text>
  
  <!-- Width and Height labels -->
  <rect x="20" y="300" width="250" height="80" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="25" y="320" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Dilworth's Theorem Example:</text>
  <text x="25" y="335" font-family="Arial, sans-serif" font-size="11" fill="#666">• Width = 3 (max antichain size)</text>
  <text x="25" y="350" font-family="Arial, sans-serif" font-size="11" fill="#666">• Height = 3 (longest chain length - 1)</text>
  <text x="25" y="365" font-family="Arial, sans-serif" font-size="11" fill="#666">• Min chains to cover = 3</text>
</svg>