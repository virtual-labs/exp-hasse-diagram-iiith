<svg width="500" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="500" height="400" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  
  <!-- Title -->
  <text x="250" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">
    Boolean Algebra B₃: Subsets of {x,y,z}
  </text>
  
  <!-- Top element -->
  <circle cx="250" cy="60" r="25" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="250" y="57" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">{x,y,z}</text>
  
  <!-- Second level -->
  <circle cx="150" cy="130" r="22" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="150" y="127" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">{x,y}</text>
  
  <circle cx="250" cy="130" r="22" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="250" y="127" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">{x,z}</text>
  
  <circle cx="350" cy="130" r="22" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="350" y="127" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">{y,z}</text>
  
  <!-- Third level -->
  <circle cx="120" cy="220" r="18" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <text x="120" y="217" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">{x}</text>
  
  <circle cx="250" cy="220" r="18" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <text x="250" y="217" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">{y}</text>
  
  <circle cx="380" cy="220" r="18" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <text x="380" y="217" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">{z}</text>
  
  <!-- Bottom element -->
  <circle cx="250" cy="310" r="20" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="250" y="317" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">∅</text>
  
  <!-- Edges from top -->
  <line x1="235" y1="82" x2="165" y2="108" stroke="#666" stroke-width="2"/>
  <line x1="250" y1="85" x2="250" y2="105" stroke="#666" stroke-width="2"/>
  <line x1="265" y1="82" x2="335" y2="108" stroke="#666" stroke-width="2"/>
  
  <!-- Edges to singletons -->
  <line x1="140" y1="150" x2="130" y2="200" stroke="#666" stroke-width="2"/>
  <line x1="160" y1="150" x2="240" y2="200" stroke="#666" stroke-width="2"/>
  
  <line x1="240" y1="150" x2="130" y2="200" stroke="#666" stroke-width="2"/>
  <line x1="260" y1="150" x2="370" y2="200" stroke="#666" stroke-width="2"/>
  
  <line x1="340" y1="150" x2="260" y2="200" stroke="#666" stroke-width="2"/>
  <line x1="360" y1="150" x2="370" y2="200" stroke="#666" stroke-width="2"/>
  
  <!-- Edges to bottom -->
  <line x1="130" y1="238" x2="240" y2="292" stroke="#666" stroke-width="2"/>
  <line x1="250" y1="238" x2="250" y2="290" stroke="#666" stroke-width="2"/>
  <line x1="370" y1="238" x2="260" y2="292" stroke="#666" stroke-width="2"/>
  
  <!-- Legend -->
  <rect x="20" y="340" width="200" height="50" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="25" y="355" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Properties:</text>
  <text x="25" y="370" font-family="Arial, sans-serif" font-size="11" fill="#666">• Distributive lattice</text>
  <text x="25" y="385" font-family="Arial, sans-serif" font-size="11" fill="#666">• Complemented</text>
  
  <!-- Operations examples -->
  <rect x="280" y="340" width="210" height="50" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="285" y="355" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Examples:</text>
  <text x="285" y="370" font-family="Arial, sans-serif" font-size="11" fill="#666">{x} ∨ {y} = {x,y}</text>
  <text x="285" y="385" font-family="Arial, sans-serif" font-size="11" fill="#666">{x,y} ∧ {x,z} = {x}</text>
</svg>