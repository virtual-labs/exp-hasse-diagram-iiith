<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="450" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  
  <!-- Title -->
  <text x="400" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">
    Lattice Operations: Join (∨) and Meet (∧)
  </text>
  
  <!-- Left lattice: Boolean algebra example -->
  <text x="150" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
    Boolean Lattice Operations
  </text>
  
  <!-- Nodes for boolean example -->
  <circle cx="150" cy="80" r="18" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="150" y="76" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">{a,b,c}</text>
  
  <circle cx="100" cy="130" r="16" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="100" y="127" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">{a,b}</text>
  
  <circle cx="150" cy="130" r="16" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="150" y="127" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">{a,c}</text>
  
  <circle cx="200" cy="130" r="16" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="200" y="127" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">{b,c}</text>
  
  <circle cx="100" cy="180" r="14" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <text x="100" y="185" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">{a}</text>
  
  <circle cx="150" cy="180" r="14" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <text x="150" y="185" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">{b}</text>
  
  <circle cx="200" cy="180" r="14" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <text x="200" y="185" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">{c}</text>
  
  <circle cx="150" cy="230" r="16" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="150" y="236" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">∅</text>
  
  <!-- Edges -->
  <line x1="140" y1="96" x2="110" y2="114" stroke="#666" stroke-width="2"/>
  <line x1="150" y1="98" x2="150" y2="114" stroke="#666" stroke-width="2"/>
  <line x1="160" y1="96" x2="190" y2="114" stroke="#666" stroke-width="2"/>
  
  <line x1="108" y1="144" x2="108" y2="166" stroke="#666" stroke-width="2"/>
  <line x1="112" y1="144" x2="142" y2="166" stroke="#666" stroke-width="2"/>
  
  <line x1="150" y1="146" x2="150" y2="164" stroke="#666" stroke-width="2"/>
  <line x1="142" y1="146" x2="108" y2="166" stroke="#666" stroke-width="2"/>
  <line x1="158" y1="146" x2="192" y2="166" stroke="#666" stroke-width="2"/>
  
  <line x1="192" y1="146" x2="158" y2="166" stroke="#666" stroke-width="2"/>
  <line x1="208" y1="146" x2="192" y2="166" stroke="#666" stroke-width="2"/>
  
  <line x1="108" y1="194" x2="142" y2="216" stroke="#666" stroke-width="2"/>
  <line x1="150" y1="194" x2="150" y2="214" stroke="#666" stroke-width="2"/>
  <line x1="192" y1="194" x2="158" y2="216" stroke="#666" stroke-width="2"/>
  
  <!-- Join operation highlight -->
  <ellipse cx="125" cy="155" rx="35" ry="35" fill="none" stroke="#f39c12" stroke-width="3" stroke-dasharray="5,5"/>
  <text x="60" y="155" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f39c12">{a} ∨ {b}</text>
  <text x="60" y="170" font-family="Arial, sans-serif" font-size="11" fill="#f39c12">= {a,b}</text>
  
  <!-- Meet operation highlight -->
  <ellipse cx="175" cy="155" rx="35" ry="35" fill="none" stroke="#e74c3c" stroke-width="3" stroke-dasharray="5,5"/>
  <text x="240" y="155" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#e74c3c">{a,b} ∧ {a,c}</text>
  <text x="240" y="170" font-family="Arial, sans-serif" font-size="11" fill="#e74c3c">= {a}</text>
  
  <!-- Right side: Divisibility lattice operations -->
  <text x="550" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
    Divisibility Lattice Operations
  </text>
  
  <!-- Divisibility nodes -->
  <circle cx="550" cy="90" r="16" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="550" y="96" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">12</text>
  
  <circle cx="500" cy="140" r="14" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="500" y="146" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">4</text>
  
  <circle cx="600" cy="140" r="14" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="600" y="146" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">6</text>
  
  <circle cx="480" cy="190" r="14" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <text x="480" y="196" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">2</text>
  
  <circle cx="620" cy="190" r="14" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <text x="620" y="196" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">3</text>
  
  <circle cx="550" cy="240" r="16" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="550" y="246" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">1</text>
  
  <!-- Divisibility edges -->
  <line x1="540" y1="104" x2="510" y2="126" stroke="#666" stroke-width="2"/>
  <line x1="560" y1="104" x2="590" y2="126" stroke="#666" stroke-width="2"/>
  <line x1="490" y1="154" x2="490" y2="176" stroke="#666" stroke-width="2"/>
  <line x1="510" y1="154" x2="610" y2="176" stroke="#666" stroke-width="2"/>
  <line x1="590" y1="154" x2="610" y2="176" stroke="#666" stroke-width="2"/>
  <line x1="490" y1="204" x2="540" y2="226" stroke="#666" stroke-width="2"/>
  <line x1="610" y1="204" x2="560" y2="226" stroke="#666" stroke-width="2"/>
  
  <!-- Operation examples -->
  <rect x="450" y="280" width="200" height="80" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="550" y="300" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Lattice Operations</text>
  <text x="460" y="320" font-family="Arial, sans-serif" font-size="11" fill="#666">4 ∨ 6 = 12 (LCM)</text>
  <text x="460" y="335" font-family="Arial, sans-serif" font-size="11" fill="#666">4 ∧ 6 = 2 (GCD)</text>
  <text x="460" y="350" font-family="Arial, sans-serif" font-size="11" fill="#666">2 ∨ 3 = 6</text>
  
  <!-- Properties comparison -->
  <rect x="350" y="380" width="400" height="60" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="550" y="400" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Lattice Type Comparison</text>
  <text x="360" y="420" font-family="Arial, sans-serif" font-size="11" fill="#666">• Boolean Algebra: Distributive + Complemented</text>
  <text x="360" y="435" font-family="Arial, sans-serif" font-size="11" fill="#666">• Divisibility Lattice: Distributive, not complemented</text>
</svg>