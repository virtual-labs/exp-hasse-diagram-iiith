<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Row 1: 4 + 3 + 2 + 1 squares -->
  <!-- Group 1: 4 squares -->
  <rect x="20" y="20" width="25" height="25" fill="none" stroke="black" stroke-width="2"/>
  <rect x="50" y="20" width="25" height="25" fill="none" stroke="black" stroke-width="2"/>
  <rect x="80" y="20" width="25" height="25" fill="none" stroke="black" stroke-width="2"/>
  <rect x="110" y="20" width="25" height="25" fill="none" stroke="black" stroke-width="2"/>
  
  <!-- Group 2: 3 squares -->
  <rect x="160" y="20" width="25" height="25" fill="none" stroke="black" stroke-width="2"/>
  <rect x="190" y="20" width="25" height="25" fill="none" stroke="black" stroke-width="2"/>
  <rect x="220" y="20" width="25" height="25" fill="none" stroke="black" stroke-width="2"/>
  
  <!-- Group 3: 2 squares -->
  <rect x="270" y="20" width="25" height="25" fill="none" stroke="black" stroke-width="2"/>
  <rect x="300" y="20" width="25" height="25" fill="none" stroke="black" stroke-width="2"/>
  
  <!-- Group 4: 1 square -->
  <rect x="350" y="20" width="25" height="25" fill="none" stroke="black" stroke-width="2"/>
  
  <!-- Row 2: empty + 1 + 2 + 1 squares -->
  <!-- Group 2: 1 square -->
  <rect x="160" y="60" width="25" height="25" fill="none" stroke="black" stroke-width="2"/>
  
  <!-- Group 3: 2 squares -->
  <rect x="270" y="60" width="25" height="25" fill="none" stroke="black" stroke-width="2"/>
  <rect x="300" y="60" width="25" height="25" fill="none" stroke="black" stroke-width="2"/>
  
  <!-- Group 4: 1 square -->
  <rect x="350" y="60" width="25" height="25" fill="none" stroke="black" stroke-width="2"/>
  
  <!-- Row 3: empty + empty + empty + 1 square -->
  <rect x="350" y="100" width="25" height="25" fill="none" stroke="black" stroke-width="2"/>
  
  <!-- Row 4: empty + empty + empty + 1 square -->
  <rect x="350" y="140" width="25" height="25" fill="none" stroke="black" stroke-width="2"/>
</svg>